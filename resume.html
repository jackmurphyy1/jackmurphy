<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Jack Murphy résumé"
  >

  <title>Résumé — Jack Murphy</title>

  <style>
    :root {
      --paper: #f7f6f2;
      --ink: #111111;
      --line: #d9d6cf;
      --accent: #2457ff;
      --max: 1060px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      margin: 0;
    }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================================
       HEADER WIDTH
       ========================================= */

    .shell {
      width: min(var(--max), calc(100% - 40px));
      margin: 0 auto;
    }

    /* =========================================
       HEADER
       ========================================= */

    .site-header {
      min-height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      border-bottom: 1px solid var(--line);
    }

    .site-name {
      font-size: 17px;
      font-weight: 650;
      letter-spacing: -0.025em;
    }

    .site-nav {
      display: flex;
      align-items: center;
      gap: 22px;
      font-size: 13px;
    }

    .site-nav a {
      padding: 3px 0;
      border-bottom: 1px solid transparent;
    }

    .site-nav a:hover,
    .site-nav a:focus-visible {
      border-color: var(--ink);
    }

    .open-pdf {
      color: var(--accent);
      border-bottom-color: var(--accent) !important;
    }

    /* =========================================
       RESUME WIDTH

       Increase 900px to make the résumé larger
       on desktop.
       ========================================= */

    .resume-main {
      width: min(900px, calc(100% - 40px));
      margin: 22px auto 32px;
    }

    /* =========================================
       RESUME IMAGE

       No embedded PDF viewer.
       No fallback message.
       No border.
       ========================================= */

    .resume-link {
      display: block;
    }

    .resume-image {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      border: 0;
      background: #ffffff;
    }

    /* =========================================
       PHONE LAYOUT
       ========================================= */

    @media (max-width: 680px) {
      .shell {
        width: calc(100% - 24px);
      }

      .site-header {
        min-height: 58px;
      }

      .site-nav {
        gap: 15px;
      }

      .resume-main {
        width: 100%;
        margin: 0;
      }

      .resume-image {
        width: 100%;
        height: auto;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="shell site-header">

    <a
      class="site-name"
      href="index.html"
    >
      Jack Murphy
    </a>

    <nav
      class="site-nav"
      aria-label="Primary navigation"
    >
      <a href="index.html#projects-title">
        Home
      </a>

      <a
        class="open-pdf"
        href="resume.pdf"
      >
        Open PDF ↗
      </a>
    </nav>

  </header>

  <!-- RESUME -->
  <main class="resume-main">

    <a
      class="resume-link"
      href="resume.pdf"
      aria-label="Open Jack Murphy resume PDF"
    >
      <img
        class="resume-image"
        src="resume-preview.jpg"
        alt="Jack Murphy mechanical engineering resume"
      >
    </a>

  </main>

</body>
</html>
